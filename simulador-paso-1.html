<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alianza para el Progreso | Simulador paso 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone-frame">
        <header class="topbar">
          <a class="icon-button icon-button--link" href="index.html" aria-label="Volver a la portada">&#8592;</a>
          <p class="topbar__title">Simulador de cédula</p>
          <div class="topbar__spacer"></div>
        </header>

        <section class="simulator-screen">
          <article class="simulator-card">
            <div class="simulator-card__brand">
              <div class="simulator-card__logo-frame">
                <img
                  class="simulator-card__logo-image"
                  src="assets/logo-alianza-para-el-progreso.png"
                  alt="Logo de Alianza para el Progreso"
                />
              </div>
            </div>

            <p class="simulator-card__eyebrow">Simulador de cédula</p>
            <h1>Aprende cómo votar</h1>

            <div class="simulator-card__date">Domingo 4 de octubre, 2026</div>

            <p class="simulator-card__text">
              Practica cómo votar por la candidatura de Alianza para el Progreso para la Alcaldía y el Concejo Provincial de Maynas, periodo 2027–2030.
            </p>

            <a class="simulator-card__button" href="simulador-paso-2.html">Siguiente</a>
          </article>
        </section>
      </section>
    </main>
    <script src="access.js"></script>
  </body>
